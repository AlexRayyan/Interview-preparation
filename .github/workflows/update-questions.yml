name: Update question bank

# Weekly: collect questions from every configured source and open a pull request.
# Review the PR (edit or delete questions in data/questions.json if needed) and merge it to publish.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources"
        default: "github,hackernews,stackexchange,reddit"
      answers:
        description: "Max model answers to write with AI this run"
        default: "60"
      limit:
        description: "Max posts to fetch per source"
        default: "100"

permissions:
  contents: write
  pull-requests: write
  models: read # free GitHub Models inference

concurrency:
  group: question-bank
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect and extract questions
        id: collect
        run: npm run update-bank -- --sources "$SOURCES" --answers "$ANSWERS" --limit "$LIMIT"
        env:
          SOURCES: ${{ inputs.sources || 'github,hackernews,stackexchange,reddit' }}
          ANSWERS: ${{ inputs.answers || '40' }}
          # Free AI via GitHub Models using the built-in token. To use another OpenAI-compatible provider,
          # set the AI_API_KEY secret and the AI_BASE_URL / AI_MODEL repository variables.
          AI_API_KEY: ${{ secrets.AI_API_KEY || github.token }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
      - run: cat "${{ runner.temp }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/question-bank-update
          commit-message: "Update question bank"
          title: "Question bank update"
          body-path: ${{ runner.temp }}/summary.md
          add-paths: data/*.json
          labels: question-bank
          delete-branch: true
