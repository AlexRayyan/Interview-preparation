name: Add community submission

# When a maintainer adds the "approved" label to a "Share your interview" issue,
# extract the questions, commit them to main (which redeploys the site) and close the issue.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write # to start the deploy workflow after committing
  models: read # free GitHub Models inference

concurrency:
  group: question-bank
  cancel-in-progress: false

jobs:
  add:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'interview-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Extract questions from the issue
        run: npm run add-submission
        env:
          # Free AI: add ONE of the GROQ_API_KEY / GEMINI_API_KEY / OPENROUTER_API_KEY secrets (free keys).
          # Any other OpenAI-compatible provider: AI_API_KEY secret + AI_BASE_URL / AI_MODEL variables.
          # With none of them, GitHub Models is tried via the built-in token.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then echo "No new questions"; exit 0; fi
          git commit -m "Add questions from issue #${{ github.event.issue.number }}"
          git push
      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file "${{ runner.temp }}/summary.md"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason completed
      - name: Deploy the updated site
        # pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo ${{ github.repository }} --ref main
